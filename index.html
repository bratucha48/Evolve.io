<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evolve.io – Foundation v0.1</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018}
body{font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%;cursor:default}
#info{
  position:fixed;top:14px;left:14px;z-index:5;
  padding:10px 14px;border-radius:10px;
  color:#dce8ef;background:rgba(5,10,16,.78);
  border:1px solid rgba(120,160,180,.25);
  font-size:13px;pointer-events:none
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="info">WASD / Pfeiltasten = Bewegen · Der Charakter schaut in Bewegungsrichtung</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){
  W=innerWidth; H=innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

const world={w:3000,h:3000};
const keys={};

addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  keys[k]=true;
  if(["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"].includes(k)){
    e.preventDefault();
  }
});
addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});

const player={
  x:world.w/2,
  y:world.h/2,
  speed:260,
  r:24,
  walk:0,
  dirX:1,
  dirY:0
};

function input(){
  let x=0,y=0;
  if(keys["w"]||keys["arrowup"])y-=1;
  if(keys["s"]||keys["arrowdown"])y+=1;
  if(keys["a"]||keys["arrowleft"])x-=1;
  if(keys["d"]||keys["arrowright"])x+=1;

  const len=Math.hypot(x,y);
  if(len>0){x/=len;y/=len}
  return {x,y,len};
}

function update(dt){
  const v=input();

  player.x+=v.x*player.speed*dt;
  player.y+=v.y*player.speed*dt;

  // Weltgrenzen
  player.x=Math.max(player.r,Math.min(world.w-player.r,player.x));
  player.y=Math.max(player.r,Math.min(world.h-player.r,player.y));

  if(v.len>0){
    player.walk+=dt*9;
    player.dirX=v.x;
    player.dirY=v.y;
  }
}

function drawWorld(camX,camY){
  ctx.fillStyle="#09131a";
  ctx.fillRect(0,0,W,H);

  const grid=100;
  ctx.strokeStyle="rgba(100,145,165,.14)";
  ctx.lineWidth=1;

  const startX=Math.floor(camX/grid)*grid;
  const startY=Math.floor(camY/grid)*grid;

  for(let x=startX;x<=camX+W+grid;x+=grid){
    ctx.beginPath();
    ctx.moveTo(x-camX,0);
    ctx.lineTo(x-camX,H);
    ctx.stroke();
  }

  for(let y=startY;y<=camY+H+grid;y+=grid){
    ctx.beginPath();
    ctx.moveTo(0,y-camY);
    ctx.lineTo(W,y-camY);
    ctx.stroke();
  }

  // Welt-Rand
  ctx.strokeStyle="rgba(80,180,220,.45)";
  ctx.lineWidth=4;
  ctx.strokeRect(-camX,-camY,world.w,world.h);
}

function drawHuman(){
  const camX=Math.max(0,Math.min(world.w-W,player.x-W/2));
  const camY=Math.max(0,Math.min(world.h-H,player.y-H/2));

  const x=player.x-camX;
  const y=player.y-camY;
  const moving=input().len>0;
  const step=moving?Math.sin(player.walk)*4:0;

  const angle=Math.atan2(player.dirY,player.dirX);
  const cos=Math.cos(angle), sin=Math.sin(angle);

  ctx.save();
  ctx.translate(x,y);

  // Schatten
  ctx.fillStyle="rgba(0,0,0,.38)";
  ctx.beginPath();
  ctx.ellipse(0,22,29,10,0,0,Math.PI*2);
  ctx.fill();

  // Körperbewegung beim Laufen
  ctx.translate(0,moving?Math.abs(Math.sin(player.walk))*1.2:0);

  // Beine
  ctx.strokeStyle="#202936";
  ctx.lineWidth=8;
  ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(-8,9);
  ctx.lineTo(-9+step,31);
  ctx.moveTo(8,9);
  ctx.lineTo(9-step,31);
  ctx.stroke();

  // Schuhe
  ctx.strokeStyle="#111820";
  ctx.lineWidth=7;
  ctx.beginPath();
  ctx.moveTo(-9+step,31);
  ctx.lineTo(-15+step,34);
  ctx.moveTo(9-step,31);
  ctx.lineTo(15-step,34);
  ctx.stroke();

  // Körper
  ctx.fillStyle="#3f6f91";
  ctx.beginPath();
  ctx.roundRect(-18,-10,36,38,9);
  ctx.fill();

  // Jackenstreifen
  ctx.strokeStyle="#83b5d1";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(0,-7);
  ctx.lineTo(0,22);
  ctx.stroke();

  // Arme – bewegen leicht mit
  ctx.strokeStyle="#d3a17b";
  ctx.lineWidth=7;
  ctx.beginPath();
  ctx.moveTo(-16,-3);
  ctx.lineTo(-28-step*.7,15+step*.25);
  ctx.moveTo(16,-3);
  ctx.lineTo(28+step*.7,15-step*.25);
  ctx.stroke();

  // Kopf
  ctx.fillStyle="#d9aa82";
  ctx.beginPath();
  ctx.arc(0,-24,15,0,Math.PI*2);
  ctx.fill();

  // Haare
  ctx.fillStyle="#49301f";
  ctx.beginPath();
  ctx.arc(0,-29,15,Math.PI,Math.PI*2);
  ctx.fill();

  // Gesicht zeigt in Bewegungsrichtung
  ctx.save();
  ctx.translate(cos*3,sin*3);
  ctx.fillStyle="#17212a";
  ctx.beginPath();
  ctx.arc(-5,-23,1.8,0,Math.PI*2);
  ctx.arc(5,-23,1.8,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Kleine Richtungshilfe: dezenter Kragen
  ctx.fillStyle="#d9e7ef";
  ctx.beginPath();
  ctx.arc(0,-10,4,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function draw(){
  const camX=Math.max(0,Math.min(world.w-W,player.x-W/2));
  const camY=Math.max(0,Math.min(world.h-H,player.y-H/2));

  drawWorld(camX,camY);
  drawHuman();
}

let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,.033);
  last=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
